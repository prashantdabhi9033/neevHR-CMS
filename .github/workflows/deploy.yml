name: Deploy to VPS

# Runs on every push to main. SSHes into the Hostinger VPS and runs deploy.sh
# (git pull, install, migrate, build, pm2 restart). Blog posts and leads are
# managed in /admin and do NOT need a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /var/www/neevhr
            bash deploy.sh
